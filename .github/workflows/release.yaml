# Release a crate whose version is already merged.
#
# Versions change by pull request (`cargo x version set <crate> <version>`,
# which also updates the requirements on the crate and Cargo.lock). This
# workflow only checks and publishes: the version in the crate's manifest
# must equal the one given here, the crate must pass its tests (with its
# compliance suites) and package from the locked dependencies, and then
# (unless it's a dry run) it is published to crates.io and tagged as a
# GitHub release of this commit.

name: Release

on:
  workflow_dispatch:
    inputs:
      project:
        type: choice
        description: "Crate to release"
        required: true
        default: forgo
        options:
          - forgo
          - forgo_lib_cli
          - forgo_lib_yaml
      version:
        description: "Its version, as in its Cargo.toml (e.g. 1.0.0)"
        required: true
      dry_run:
        type: boolean
        description: "Check everything, publish nothing"
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Inputs reach the shell as environment variables, never as code.
      PROJECT: ${{ inputs.project }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build cargo x
        run: cargo build --locked -p forgo_dev

      - name: Check the version
        run: |
          cargo run --quiet --locked -p forgo_dev -- semver validate "$VERSION"
          have="$(cargo run --quiet --locked -p forgo_dev -- version get "$PROJECT")"
          if [ "$have" != "$VERSION" ]; then
            echo "::error::crates/$PROJECT is at $have, not $VERSION: merge the version first (cargo x version set $PROJECT $VERSION)"
            exit 1
          fi

      - name: Fetch the crate's compliance suites
        # As the CI test job does: the official test suites a crate checks
        # itself against aren't committed.
        run: |
          for script in crates/"$PROJECT"/scripts/fetch-*.sh; do
            [ -e "$script" ] || continue
            "$script"
          done

      - name: Test
        env:
          # Compliance tests fail instead of skipping without their data.
          YAML_TEST_SUITE_REQUIRED: "1"
          SEMVER_NODE_REQUIRED: "1"
          TOML_TEST_SUITE_REQUIRED: "1"
        run: cargo test --locked -p "$PROJECT"

      - name: Package
        run: cargo package --locked -p "$PROJECT"

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p "$PROJECT"

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$PROJECT@$VERSION"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
