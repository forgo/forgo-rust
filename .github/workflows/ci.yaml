name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - forgo
          - forgo_dev
          - forgo_lib_cli
          - forgo_lib_yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rust setup
        uses: ./.github/actions/setup-rust
      - name: Run formatting check
        run: cargo make fmt-check-project ${{ matrix.project }}
      - name: Run clippy check
        run: cargo make clippy-check-project ${{ matrix.project }}
      - name: Run documentation check
        run: cargo make doc-check-project ${{ matrix.project }}

  msrv:
    # forgo_lib_yaml declares a minimum supported Rust version
    # (`rust-version` in its Cargo.toml); make sure it still builds there.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build forgo_lib_yaml with its minimum supported Rust version
        run: |
          msrv=$(grep -m1 '^rust-version' crates/forgo_lib_yaml/Cargo.toml | cut -d '"' -f 2)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check -p forgo_lib_yaml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - forgo
          - forgo_dev
          - forgo_lib_cli
          - forgo_lib_yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rust setup
        uses: ./.github/actions/setup-rust
      - name: Fetch the official YAML test suite
        if: matrix.project == 'forgo_lib_yaml'
        run: crates/forgo_lib_yaml/scripts/fetch-yaml-test-suite.sh
      - name: Run tests for ${{ matrix.project }}
        run: cargo make test-project ${{ matrix.project }}
        env:
          # The YAML compliance tests fail instead of skipping without the suite.
          YAML_TEST_SUITE_REQUIRED: "1"

  test-windows:
    # forgo_dev edits files in place and runs cargo and git: check it on
    # Windows too (paths, line endings, replacing files).
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run forgo_dev tests
        run: cargo test -p forgo_dev

  dependencies:
    # The workspace has no third-party dependencies apart from wasm-bindgen
    # (for `cargo x new wasm` crates). Any other crate in Cargo.lock must be
    # added to .github/allowed-dependencies.txt on purpose.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Cargo.lock for third-party crates that aren't allowed
        run: |
          awk '
            FNR == NR { sub(/#.*/, ""); gsub(/[ \t\r]/, ""); if ($0 != "") allowed[$0] = 1; next }
            /^\[\[package\]\]/ { name = "" }
            /^name = / { name = $3; gsub(/"/, "", name) }
            /^source = / && !(name in allowed) {
              print "Cargo.lock: " name " is not in .github/allowed-dependencies.txt"
              bad = 1
            }
            END { exit bad }
          ' .github/allowed-dependencies.txt Cargo.lock
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Check that Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
