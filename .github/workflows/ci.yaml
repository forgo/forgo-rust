name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - forgo
          - forgo_dev
          - forgo_lib_cli
          - forgo_lib_semver
          - forgo_lib_toml
          - forgo_lib_yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rust setup
        uses: ./.github/actions/setup-rust
      - name: Run formatting check
        run: cargo make fmt-check-project ${{ matrix.project }}
      - name: Run clippy check
        run: cargo make clippy-check-project ${{ matrix.project }}
      - name: Run documentation check
        run: cargo make doc-check-project ${{ matrix.project }}

  msrv-matrix:
    # The crates that declare a minimum supported Rust version
    # (`rust-version`, or inherited from [workspace.package]), from
    # `cargo x ci matrix`.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: List the crates and their minimum Rust versions
        id: matrix
        run: echo "matrix=$(cargo run --quiet --locked -p forgo_dev -- ci matrix)" >> "$GITHUB_OUTPUT"

  msrv:
    # Each of those crates must still build with its minimum Rust version.
    needs: msrv-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.msrv-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build ${{ matrix.crate }} with Rust ${{ matrix.msrv }}
        env:
          CRATE: ${{ matrix.crate }}
          MSRV: ${{ matrix.msrv }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          cargo +"$MSRV" check -p "$CRATE"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - forgo
          - forgo_dev
          - forgo_lib_cli
          - forgo_lib_semver
          - forgo_lib_toml
          - forgo_lib_yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rust setup
        uses: ./.github/actions/setup-rust
      - name: Fetch the official YAML test suite
        if: matrix.project == 'forgo_lib_yaml'
        run: crates/forgo_lib_yaml/scripts/fetch-yaml-test-suite.sh
      - name: Record node-semver's behaviour (Node.js)
        if: matrix.project == 'forgo_lib_semver'
        run: crates/forgo_lib_semver/scripts/fetch-node-semver.sh
      - name: Fetch the toml-test suite
        if: matrix.project == 'forgo_lib_toml'
        run: crates/forgo_lib_toml/scripts/fetch-toml-test.sh
      - name: Run tests for ${{ matrix.project }}
        run: cargo make test-project ${{ matrix.project }}
        env:
          # Compliance tests fail instead of skipping without their data.
          YAML_TEST_SUITE_REQUIRED: "1"
          SEMVER_NODE_REQUIRED: "1"
          TOML_TEST_SUITE_REQUIRED: "1"

  test-windows:
    # forgo_dev edits files in place and runs cargo and git: check it on
    # Windows too (paths, line endings, replacing files).
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run forgo_dev tests
        run: cargo test -p forgo_dev

  dependencies:
    # The workspace has no third-party dependencies apart from wasm-bindgen
    # (for `cargo x new wasm` crates). Any other crate in Cargo.lock must be
    # added to .github/allowed-dependencies.txt on purpose.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Check that Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Check Cargo.lock for third-party crates that aren't allowed
        run: cargo run --quiet --locked -p forgo_dev -- deps check
