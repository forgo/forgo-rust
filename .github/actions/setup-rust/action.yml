name: "Setup Rust"
description: "Sets up the stable Rust toolchain and its cache, and installs cargo-make"
inputs:
  cargo_make_version:
    description: "Version of cargo-make to install"
    required: false
    default: "0.37.24"
runs:
  using: "composite"
  steps:
    # Also restores and saves the cache (Swatinem/rust-cache): the cargo
    # registry and git checkouts, `target`, and the tools installed into
    # ~/.cargo/bin during the job, such as cargo-make below.
    - name: Set up Rust stable toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Install cargo-make if not already installed
      shell: bash
      env:
        VERSION: ${{ inputs.cargo_make_version }}
      run: |
        if ! command -v cargo-make > /dev/null; then
          echo "Installing cargo-make..."
          cargo install cargo-make --version "$VERSION" --locked
        else
          echo "cargo-make is already installed."
        fi
