[package]
name = "forgo_lib_cli"
version = "0.0.0"
edition = "2024"
publish = true
description = "A library to help build common features into your CLI (e.g. - device code flow)."
license = "MIT"
repository = "https://github.com/forgo/forgo-rust"
keywords = ["cli", "library", "command-line", "forgo"]
categories = ["command-line-interface"]
readme = "README.md" # relative to this Cargo.toml

[dependencies]
reqwest = { version = "0.12.15", features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
josekit = { version = "0.10.1" }
