# Four-space indentation, as some projects use.
services:
    api:
        image: registry.example.com/api:2.4.1
        environment:
            - DATABASE_URL=postgres://db/app
            - LOG_LEVEL=info
        depends_on:
            - db
        ports:
            - "8080:8080"

    db:
        image: postgres:17
        volumes:
            - data:/var/lib/postgresql/data   # persisted
volumes:
    data: {}
