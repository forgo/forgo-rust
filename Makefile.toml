# =============================================================================
# Development Shortcuts
#
# Note: These watch commands bypass cargo-make in order to hot-reload changes.
#
# For continuous development (binary):
#   Run: `cargo watch -x "run -p forgo"`
#
# For continuous testing (library + binary):
#   Run: `cargo watch -x "test -p forgo_lib_cli"`
#
# =============================================================================


# Used by `cargo-make`
# https://github.com/sagiegurari/cargo-make
# e.g. - `cargo make ci`

[config]
# Run each task once, from the workspace root. (By default cargo-make runs a
# task in every workspace member: `test-project forgo_lib_yaml` ran the
# same tests once per member.) The `*-project` tasks select their crate
# with `-p`.
default_to_workspace = false

[env]
# Automatically Extend Workspace Makefile
# IOW - recognize tasks in a workspace context
# https://github.com/sagiegurari/cargo-make#usage-workspace-extend
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[tasks.fmt-check]
description = "Check code formatting using rustfmt"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-check-project]
description = "Check code formatting using rustfmt"
command = "cargo"
args = ["fmt", "-p", "${@}", "--", "--check"]

[tasks.clippy-check]
description = "Run clippy on every target (tests and examples too), treating warnings as errors"
command = "cargo"
args = ["clippy", "--all", "--all-targets", "--", "-D", "warnings"]

[tasks.clippy-check-project]
description = "Run clippy on every target (tests and examples too), treating warnings as errors"
command = "cargo"
args = ["clippy", "-p", "${@}", "--all-targets", "--", "-D", "warnings"]

[tasks.doc-check-project]
description = "Build a project's documentation, treating warnings (such as broken links) as errors"
command = "cargo"
args = ["doc", "-p", "${@}", "--no-deps"]
env = { RUSTDOCFLAGS = "-D warnings" }

[tasks.test]
description = "Run all tests across the workspace"
command = "cargo"
args = ["test", "--all"]

[tasks.test-project]
description = "Run tests for a specific project (set PROJECT env variable)"
command = "cargo"
args = ["test", "-p", "${@}"]

[tasks.run]
description = "Build and run a specified project"
command = "cargo"
args = ["run", "-p", "${@}"]